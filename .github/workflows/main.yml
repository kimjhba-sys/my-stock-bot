name: Stock Bot Final Run

on:
  workflow_dispatch: # 지금 당장 실행 버튼 생성

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치 (버전 업그레이드 완료)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필수 도구 설치
        run: |
          pip install --upgrade pip
          pip install pandas finance-datareader pykrx openpyxl

      - name: 주식 봇 실행
        env:
          EMAIL_USER: ${{ secrets.MY_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.MY_PASSWORD }}
        run: python whale_bot.py
